<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>
</head>
<body>
    <h1>Menú</h1>
    <ul>
        <li><a href="{{ url_for('crear_integrante') }}">Crear Integrante</a></li>
        {% if integrantes %}
            <li><a href="{{ url_for('crear_grupo') }}">Crear Grupo Musical</a></li>
        {% else %}
            <li>Crear Grupo Musical (Necesita integrantes)</li>
        {% endif %}

        {% if grupos %}
            <li><a href="{{ url_for('crear_concierto') }}">Crear Concierto</a></li>
        {% else %}
            <li>Crear Concierto (Necesita grupos)</li>
        {% endif %}

        <li><a href="{{ url_for('ver_informacion') }}">Ver toda la información</a></li>
    </ul>
</body>
</html>
